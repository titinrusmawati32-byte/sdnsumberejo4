<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193740"/>
      <stop offset="50%" stop-color="#12272e"/>
      <stop offset="100%" stop-color="#0b181c"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4835a"/>
      <stop offset="100%" stop-color="#8c5e37"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="100%" stop-color="#5c382e"/>
    </linearGradient>
    <filter id="shadowMeeting" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Board Frame -->
  <rect width="600" height="320" rx="14" fill="url(#frameGrad)"/>
  <!-- Inner Board Surface -->
  <rect x="12" y="12" width="576" height="250" rx="8" fill="url(#wallGrad)"/>

  <!-- Left Wall & Window Light -->
  <rect x="12" y="12" width="70" height="250" fill="#ffffff" opacity="0.05"/>
  <!-- Potted Plant Far Left -->
  <g transform="translate(35, 185)">
    <!-- Pot -->
    <polygon points="5,45 25,45 30,20 0,20" fill="#a16207"/>
    <!-- Leaves -->
    <path d="M15,20 Q0,5 5,-15 Q15,5 15,20 Z" fill="#22c55e"/>
    <path d="M15,20 Q28,0 35,-10 Q28,10 15,20 Z" fill="#16a34a"/>
    <path d="M15,20 Q-10,10 -15,-5 Q0,10 15,20 Z" fill="#15803d"/>
  </g>

  <!-- Female Teacher Character Left-Center -->
  <g transform="translate(145, 80)">
    <!-- Hair / Hijab -->
    <ellipse cx="0" cy="50" rx="35" ry="42" fill="#1e293b"/>
    <!-- Face -->
    <ellipse cx="0" cy="52" rx="22" ry="26" fill="#fcd34d"/>
    <!-- Hair strands front -->
    <path d="M-20,40 Q-5,30 5,38 Q15,30 20,42 Q0,26 -20,40 Z" fill="#0f172a"/>
    <!-- Smile & Eyes -->
    <circle cx="-8" cy="50" r="2.5" fill="#1e293b"/>
    <circle cx="8" cy="50" r="2.5" fill="#1e293b"/>
    <path d="M-6,62 Q0,69 6,62" stroke="#b91c1c" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- PNS / ASN Khaki Uniform -->
    <path d="M-36,88 Q0,75 36,88 L46,200 L-46,200 Z" fill="url(#uniformGrad)"/>
    <!-- Collar & ID Badge -->
    <polygon points="0,85 -16,105 0,118 16,105" fill="#fef3c7"/>
    <rect x="-8" y="124" width="16" height="22" rx="2" fill="#3b82f6"/>
    <!-- Right Arm Holding Tablet / Folder -->
    <path d="M-35,100 L-20,150 L10,135 L-5,95 Z" fill="url(#uniformGrad)"/>
    <rect x="-24" y="130" width="34" height="42" rx="4" fill="#1e293b" transform="rotate(-15, -24, 130)"/>
    <!-- Left Hand Pointing to Headline -->
    <path d="M35,100 Q50,115 65,105 Q55,95 40,88 Z" fill="url(#uniformGrad)"/>
    <circle cx="68" cy="103" r="6" fill="#fcd34d"/>
    <path d="M68,103 L82,92" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Side Headline Typography -->
  <g filter="url(#shadowMeeting)">
    <text x="400" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">Rapat Orang Tua</text>
    <text x="400" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="1">Wali Murid</text>
  </g>

  <!-- Gold Badge Pill: TAHUN AJARAN 2026/2027 -->
  <g filter="url(#shadowMeeting)">
    <rect x="295" y="166" width="210" height="30" rx="15" fill="url(#goldBadge)"/>
    <text x="400" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1.5">TAHUN AJARAN 2026/2027</text>
  </g>

  <!-- Conference Table at Bottom -->
  <rect x="0" y="240" width="600" height="80" fill="#2d1f19"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#5c382e" stroke-width="3"/>

  <!-- Laptop on Table Right -->
  <g transform="translate(430, 205) scale(0.85)">
    <rect x="0" y="0" width="90" height="55" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="4" y="4" width="82" height="47" rx="2" fill="#0284c7"/>
    <polygon points="-10,55 100,55 110,65 -20,65" fill="#94a3b8"/>
  </g>
</svg>
