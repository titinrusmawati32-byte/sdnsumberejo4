<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="320" rx="14" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M-20,120 Q30,80 80,110 Q140,70 190,110 Q240,80 290,120 L290,200 L-20,200 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M350,140 Q410,90 470,130 Q530,90 590,130 Q630,100 650,140 L650,220 L350,220 Z" fill="#ffffff" opacity="0.2"/>

  <!-- Sun Rays Flare -->
  <circle cx="530" cy="50" r="120" fill="#ffffff" opacity="0.15"/>
  <circle cx="530" cy="50" r="60" fill="#fef08a" opacity="0.25"/>

  <!-- School Building Silhouette Background -->
  <rect x="0" y="210" width="600" height="110" fill="#e0f2fe" opacity="0.3"/>
  <polygon points="60,210 110,170 160,210" fill="#f87171" opacity="0.5"/>
  <polygon points="440,210 490,170 540,210" fill="#f87171" opacity="0.5"/>
  <rect x="80" y="195" width="60" height="25" fill="#fef08a" opacity="0.4"/>
  <rect x="460" y="195" width="60" height="25" fill="#fef08a" opacity="0.4"/>

  <!-- Flagpole Left -->
  <line x1="50" y1="260" x2="50" y2="60" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="50" cy="58" r="5" fill="#f59e0b"/>
  <!-- Indonesian Flag Left -->
  <path d="M52,65 Q85,55 110,68 Q130,78 110,95 Q85,82 52,90 Z" fill="url(#flagRed)"/>
  <path d="M52,90 Q85,82 110,95 Q130,105 110,120 Q85,108 52,115 Z" fill="#ffffff"/>

  <!-- Flagpole Right -->
  <line x1="550" y1="260" x2="550" y2="60" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="550" cy="58" r="5" fill="#f59e0b"/>
  <!-- Indonesian Flag Right -->
  <path d="M548,65 Q515,55 490,68 Q470,78 490,95 Q515,82 548,90 Z" fill="url(#flagRed)"/>
  <path d="M548,90 Q515,82 490,95 Q470,105 490,120 Q515,108 548,115 Z" fill="#ffffff"/>

  <!-- Main Headline Typography -->
  <g filter="url(#dropGlow)">
    <text x="300" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">HARI</text>
    <text x="300" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="1">SUMPAH PEMUDA</text>
  </g>

  <!-- Red Date Badge Pill -->
  <g filter="url(#dropGlow)">
    <rect x="220" y="162" width="160" height="28" rx="14" fill="url(#badgeGrad)"/>
    <text x="300" y="181" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">28 OKTOBER</text>
  </g>

  <!-- Ground / School Yard -->
  <ellipse cx="300" cy="340" rx="360" ry="100" fill="#388e3c"/>
  <ellipse cx="300" cy="355" rx="360" ry="90" fill="#2e7d32"/>

  <!-- Elementary Students Silhouette / Illustrated Row -->
  <!-- Student 1 Left -->
  <g transform="translate(100, 210) scale(0.95)">
    <!-- Backpack -->
    <rect x="-18" y="25" width="36" height="40" rx="10" fill="#b91c1c"/>
    <!-- Body -->
    <path d="M-14,35 Q0,25 14,35 L16,90 L-16,90 Z" fill="#ffffff"/>
    <polygon points="-6,35 6,35 0,65" fill="#dc2626"/>
    <!-- Head & Hair -->
    <circle cx="0" cy="14" r="16" fill="#fcd34d"/>
    <path d="M-16,10 Q0,-6 16,10 Q14,0 0,-4 Q-14,0 -16,10 Z" fill="#1e293b"/>
    <!-- Hat -->
    <path d="M-14,4 Q0,-8 14,4 L18,8 L-18,8 Z" fill="#b91c1c"/>
  </g>

  <!-- Student 2 (Girl in Hijab) -->
  <g transform="translate(170, 205) scale(0.98)">
    <rect x="-18" y="28" width="36" height="42" rx="10" fill="#b91c1c"/>
    <path d="M-15,38 Q0,28 15,38 L18,95 L-18,95 Z" fill="#ffffff"/>
    <!-- Hijab Head -->
    <ellipse cx="0" cy="18" rx="18" ry="22" fill="#ffffff"/>
    <circle cx="0" cy="20" r="11" fill="#fcd34d"/>
  </g>

  <!-- Student 3 Center (Boy with Cap) -->
  <g transform="translate(245, 195) scale(1.05)">
    <rect x="-20" y="25" width="40" height="45" rx="10" fill="#b91c1c"/>
    <path d="M-16,36 Q0,26 16,36 L18,100 L-18,100 Z" fill="#ffffff"/>
    <polygon points="-7,36 7,36 0,68" fill="#dc2626"/>
    <!-- Head & Hat -->
    <circle cx="0" cy="14" r="16" fill="#fcd34d"/>
    <path d="M-18,6 Q0,-10 18,6 L22,10 L-22,10 Z" fill="#dc2626"/>
    <path d="M-14,6 Q0,-4 14,6 L14,10 L-14,10 Z" fill="#ffffff"/>
  </g>

  <!-- Student 4 (Girl in Hijab Center-Right) -->
  <g transform="translate(325, 200) scale(1)">
    <rect x="-18" y="28" width="36" height="42" rx="10" fill="#b91c1c"/>
    <path d="M-15,38 Q0,28 15,38 L18,95 L-18,95 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="18" rx="18" ry="22" fill="#ffffff"/>
    <circle cx="0" cy="20" r="11" fill="#fcd34d"/>
  </g>

  <!-- Student 5 Right (Boy) -->
  <g transform="translate(400, 205) scale(0.98)">
    <rect x="-18" y="25" width="36" height="40" rx="10" fill="#b91c1c"/>
    <path d="M-14,35 Q0,25 14,35 L16,90 L-16,90 Z" fill="#ffffff"/>
    <polygon points="-6,35 6,35 0,65" fill="#dc2626"/>
    <circle cx="0" cy="14" r="16" fill="#fcd34d"/>
    <path d="M-16,10 Q0,-6 16,10 Q14,0 0,-4 Q-14,0 -16,10 Z" fill="#1e293b"/>
    <path d="M-14,4 Q0,-8 14,4 L18,8 L-18,8 Z" fill="#b91c1c"/>
  </g>

  <!-- Student 6 Far Right -->
  <g transform="translate(470, 212) scale(0.92)">
    <rect x="-18" y="25" width="36" height="40" rx="10" fill="#b91c1c"/>
    <path d="M-14,35 Q0,25 14,35 L16,90 L-16,90 Z" fill="#ffffff"/>
    <polygon points="-6,35 6,35 0,65" fill="#dc2626"/>
    <circle cx="0" cy="14" r="16" fill="#fcd34d"/>
    <path d="M-16,10 Q0,-6 16,10 Q14,0 0,-4 Q-14,0 -16,10 Z" fill="#1e293b"/>
  </g>
</svg>
