<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circle with Gold Border -->
  <circle cx="60" cy="60" r="56" fill="white" stroke="#eab308" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Shield Base -->
  <path d="M 60 18 Q 84 18 88 36 C 88 68 60 88 60 96 C 60 88 32 68 32 36 Q 36 18 60 18 Z" fill="url(#shieldGrad)" stroke="#eab308" stroke-width="2.5"/>

  <!-- Laurel Wreath branches (Gold) -->
  <g fill="#eab308" opacity="0.9">
    <!-- Left leaves -->
    <path d="M 26 50 C 22 42 28 35 28 35 C 28 35 31 43 26 50 Z"/>
    <path d="M 23 62 C 18 55 24 48 24 48 C 24 48 28 55 23 62 Z"/>
    <path d="M 26 74 C 20 68 25 61 25 61 C 25 61 30 67 26 74 Z"/>
    <path d="M 33 84 C 27 79 31 72 31 72 C 31 72 37 77 33 84 Z"/>
    <path d="M 44 92 C 38 88 41 81 41 81 C 41 81 48 85 44 92 Z"/>

    <!-- Right leaves -->
    <path d="M 94 50 C 98 42 92 35 92 35 C 92 35 89 43 94 50 Z"/>
    <path d="M 97 62 C 102 55 96 48 96 48 C 96 48 92 55 97 62 Z"/>
    <path d="M 94 74 C 100 68 95 61 95 61 C 95 61 90 67 94 74 Z"/>
    <path d="M 87 84 C 93 79 89 72 89 72 C 89 72 83 77 87 84 Z"/>
    <path d="M 76 92 C 82 88 79 81 79 81 C 79 81 72 85 76 92 Z"/>
  </g>

  <!-- Open Book Symbol -->
  <path d="M 60 52 C 53 47 43 47 41 50 L 41 68 C 47 65 54 66 60 70 C 66 66 73 65 79 68 L 79 50 C 77 47 67 47 60 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="52" x2="60" y2="70" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="45" y1="56" x2="55" y2="54" stroke="#94a3b8" stroke-width="1"/>
  <line x1="45" y1="60" x2="55" y2="58" stroke="#94a3b8" stroke-width="1"/>
  <line x1="65" y1="54" x2="75" y2="56" stroke="#94a3b8" stroke-width="1"/>
  <line x1="65" y1="58" x2="75" y2="60" stroke="#94a3b8" stroke-width="1"/>

  <!-- Star / Torch above book -->
  <polygon points="60,30 63,38 71,38 65,43 67,51 60,46 53,51 55,43 49,38 57,38" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="0.75"/>

  <!-- Ribbon at bottom -->
  <path d="M 28 97 L 38 92 L 60 95 L 82 92 L 92 97 L 88 104 L 60 102 L 32 104 Z" fill="#1e3a8a" stroke="#eab308" stroke-width="1.2"/>
  <text x="60" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="1">SUMBEREJO 04</text>
</svg>
